
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Result Portal</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 14px;
      font-family: Arial, sans-serif;
      background: #eef3fb;
      color: #1e293b;
    }
    .container {
      max-width: 760px;
      margin: 30px auto;
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 5px 24px #00000012;
    }
    h1 { color: #174ea6; text-align: center; }
    .subtitle { text-align: center; color: #64748b; }
    .search { display: flex; gap: 10px; margin: 25px 0; }
    input {
      min-width: 0;
      flex: 1;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 16px;
    }
    button {
      border: 0;
      background: #174ea6;
      color: white;
      padding: 13px 20px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 16px;
    }
    .result { display: none; }
    .student { background: #eff6ff; padding: 16px; border-radius: 8px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 18px; }
    th, td { border: 1px solid #dbe3ee; padding: 11px; text-align: left; }
    th { background: #174ea6; color: white; }
    .message { text-align: center; color: #b91c1c; }
    .total { font-size: 18px; font-weight: bold; margin-top: 18px; }
    @media (max-width: 480px) {
      .container { padding: 18px; }
      .search { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Student Result Portal</h1>
    <p class="subtitle">Enter your roll number to view your result</p>

    <form class="search" id="searchForm">
      <input id="roll" type="text" inputmode="numeric"
             placeholder="Enter roll number" required>
      <button type="submit">View Result</button>
    </form>

    <p id="message" class="message" role="status"></p>
    <section id="result" class="result" aria-live="polite"></section>
  </main>

<script>
const csvFile = "./Unit%20test%20-1%20and%20MSE.csv";
let students = [];
let headers = [];

function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", quoted = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];

    if (c === '"' && quoted && text[i + 1] === '"') {
      cell += '"'; i++;
    } else if (c === '"') {
      quoted = !quoted;
    } else if (c === "," && !quoted) {
      row.push(cell.trim()); cell = "";
    } else if ((c === "\n" || c === "\r") && !quoted) {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell.trim());
      if (row.some(v => v !== "")) rows.push(row);
      row = []; cell = "";
    } else {
      cell += c;
    }
  }
  if (cell || row.length) {
    row.push(cell.trim());
    if (row.some(v => v !== "")) rows.push(row);
  }
  return rows;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[c]);
}

function showResult(roll) {
  const message = document.getElementById("message");
  const output = document.getElementById("result");
  output.style.display = "none";
  output.innerHTML = "";

  const student = students.find(s =>
    (s[0] || "").trim().toLowerCase() === roll.trim().toLowerCase()
  );

  if (!student) {
    message.textContent = "No result found for this roll number. Please check and try again.";
    return;
  }

  message.textContent = "";
  const details = headers.map((header, i) =>
    `<tr><th>${escapeHTML(header)}</th><td>${escapeHTML(student[i])}</td></tr>`
  ).join("");

  output.innerHTML = `
    <div class="student">
      <h2>${escapeHTML(student[1] || "Student Result")}</h2>
      <p><strong>Roll Number:</strong> ${escapeHTML(student[0])}</p>
    </div>
    <h3>Subject-wise Marks and Result</h3>
    <div class="table-wrap">
      <table><tbody>${details}</tbody></table>
    </div>
    <p class="subtitle">Please verify your marks with your institution.</p>
  `;
  output.style.display = "block";
}

fetch(csvFile)
  .then(response => {
    if (!response.ok) throw new Error("CSV file could not be loaded.");
    return response.text();
  })
  .then(text => {
    const rows = parseCSV(text);
    if (rows.length < 2) throw new Error("No student records found.");
    headers = rows[0];
    students = rows.slice(1);
    document.getElementById("message").textContent =
      "Results are ready. Enter your roll number.";
  })
  .catch(() => {
    document.getElementById("message").textContent =
      "Unable to load results. Please check the CSV filename in GitHub.";
  });

document.getElementById("searchForm").addEventListener("submit", event => {
  event.preventDefault();
  if (!students.length) {
    document.getElementById("message").textContent =
      "Results are still loading. Please try again.";
    return;
  }
  showResult(document.getElementById("roll").value);
});
</script>
</body>
</html>
